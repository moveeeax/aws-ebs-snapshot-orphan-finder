name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Tests
        run: pytest

      - name: Help works
        run: aws-ebs-snapshot-orphan-finder --help

      - name: Example sweep exits 1 on findings
        run: |
          set +e
          aws-ebs-snapshot-orphan-finder --from-files examples/ --max-age-days 90
          code=$?
          set -e
          test "$code" -eq 1

      - name: Cleanup list is delete-snapshot lines only
        run: |
          set +e
          aws-ebs-snapshot-orphan-finder --from-files examples/ --print-cleanup > /tmp/cleanup.txt
          set -e
          test -s /tmp/cleanup.txt
          ! grep -vq '^aws ec2 delete-snapshot ' /tmp/cleanup.txt
