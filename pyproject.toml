[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-ebs-snapshot-orphan-finder"
version = "0.1.0"
description = "Find EBS snapshots nothing references any more — and what they cost you every month"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "ebs", "snapshots", "finops", "audit", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.26"]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/moveeeax/aws-ebs-snapshot-orphan-finder"
Issues = "https://github.com/moveeeax/aws-ebs-snapshot-orphan-finder/issues"

[project.scripts]
aws-ebs-snapshot-orphan-finder = "aws_ebs_snapshot_orphan_finder.cli:main"

[tool.setuptools]
packages = ["aws_ebs_snapshot_orphan_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
